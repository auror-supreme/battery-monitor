<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Management Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <div class="card">
            
            <div class="card-header">
                <h2>System Analytics</h2>
                <div class="header-icons">
                    <span class="status-indicator" id="connectionStatus">Offline</span>
                    <span class="icon-expand">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
                    </span>
                </div>
            </div>

            <div class="chart-container" style="position: relative;">
                <div id="chartOverlay" class="chart-overlay">
                    <span>Awaiting Telemetry Data...</span>
                </div>
                <canvas id="voltageChart"></canvas>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th></th>
                            <th>Parameter</th>
                            <th>Status</th>
                            <th>Diagnostic</th>
                            <th>Current Val</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td><span class="dot dot-blue"></span></td>
                            <td>Solar Array (V)</td>
                            <td id="status-solar">--</td>
                            <td><span class="icon-check" id="diag-solar">-</span></td>
                            <td id="val-solar">--</td>
                        </tr>
                        <tr>
                            <td><span class="dot dot-orange"></span></td>
                            <td>Battery Pack (V)</td>
                            <td id="status-battery">--</td>
                            <td><span class="icon-check" id="diag-battery">-</span></td>
                            <td id="val-battery">--</td>
                        </tr>
                        <tr>
                            <td><span class="dot dot-green"></span></td>
                            <td>Inverter Load (A)</td>
                            <td id="status-load">--</td>
                            <td><span class="icon-check" id="diag-load">-</span></td>
                            <td id="val-load">--</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="card-footer">
                <div class="controls-hint">
                    <!-- Clean footer -->
                </div>
                <button class="download-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    DOWNLOAD CSV
                </button>
            </div>

        </div>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
